idempotency:
  supported: true
  header: x-idempotency-key
  value_format: UUID v4
  required_on: [POST, PATCH]
  optional_on: [GET, PUT, DELETE, OPTIONS, HEAD]
  retention_hours: 48
  constraints:
    - Key MUST be unique and MUST NOT be reused with a different payload for the same operation.
    - MUST NOT include more than one x-idempotency-key header in a single request.
  behavior:
    first_time: Request processed normally.
    retry_after_completion: Returns the stored result of the original operation (no reprocessing).
    concurrent_retry: Returns 409 Conflict while the original is still processing.
  error_scenarios:
    - {condition: missing required key, status: 400}
    - {condition: key reused with different payload, status: 422}
    - {condition: retried while still processing, status: 409}
    - {condition: more than one key header, status: 400}
  docs: https://cubiapi.readme.io/docs/idempotency
