aid: customers-bank
url: https://raw.githubusercontent.com/api-evangelist/customers-bank/refs/heads/main/apis.yml
name: Customers Bank
kind: company
description: Customers Bank is a Pennsylvania state-chartered, FDIC-insured full-service commercial
  bank and the principal subsidiary of Customers Bancorp, Inc. (NYSE CUBI), a super-regional
  bank holding company with roughly $22 billion in assets headquartered in West Reading, Pennsylvania.
  Beyond traditional commercial and consumer banking it operates a national embedded-banking
  / Banking-as-a-Service platform, exposing a first-party, OAuth2-secured REST API surface (accounts,
  ACH, wires, instant payments, book transfers, consumer lending, plus partner, IT-operations
  and webhook management) to fintech and corporate partners through a public ReadMe developer
  portal at cubiapi.readme.io, complete with a hosted Model Context Protocol (MCP) server for
  AI agents. This is proprietary, partner-gated integration infrastructure rather than an FDX
  or CFPB Section 1033 consumer-permissioned data-sharing API; no FDX-conformant or Section
  1033 data-access endpoint is publicly documented, and the surface is a sandbox-first partner
  API secured by OAuth2 client-credentials with HMAC-signed webhooks.
