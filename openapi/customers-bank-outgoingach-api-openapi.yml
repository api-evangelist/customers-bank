openapi: 3.2.0
info:
  title: Outgoing Ach API
  version: v1
  description: Allows for querying and management of outgoing ACH payments
servers:
- url: https://cubi-sandbox-api.customersbank.com/ach/v1
tags:
- name: OutgoingAch
  description: Allows for querying and management of outgoing ACH payments
paths:
  /outgoing/{id}:
    get:
      tags:
      - OutgoingAch
      summary: /outgoing/{id} - GET
      description: Gets a sent ACH transaction
      operationId: get-outgoing-id
      parameters:
      - name: id
        in: path
        description: The id of the ach transaction to GET
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Cubi.Ach.WebApi.Dto.AchTransactionDto'
              examples:
                default:
                  value: null
            application/json:
              schema:
                $ref: '#/components/schemas/Cubi.Ach.WebApi.Dto.AchTransactionDto'
              example:
                id: string
                referenceDescription: string
                status: Initiated
                creditName: string
                creditAccountNumber: string
                creditRoutingNumber: string
                debitAccountNumber: string
                debitRoutingNumber: string
                debitAccountType: Checking
                debitName: string
                amount: 0
                creditAccountType: Checking
                createdAt: string
                completedAt: string
                processDate: string
                direction: Credit
                lineItemReferenceId: string
                debitTraceNumber: string
                creditTraceNumber: string
                reversalId: string
                reversedAt: string
                reversedReason: DuplicateEntry
                reversedDescription: string
                programId: string
                cancelledAt: string
                cancelledReasons:
                - string
                returnId: string
                returnedAt: string
                returnCode: string
                batchDescription: string
            text/json:
              schema:
                $ref: '#/components/schemas/Cubi.Ach.WebApi.Dto.AchTransactionDto'
              example:
                id: string
                referenceDescription: string
                status: Initiated
                creditName: string
                creditAccountNumber: string
                creditRoutingNumber: string
                debitAccountNumber: string
                debitRoutingNumber: string
                debitAccountType: Checking
                debitName: string
                amount: 0
                creditAccountType: Checking
                createdAt: string
                completedAt: string
                processDate: string
                direction: Credit
                lineItemReferenceId: string
                debitTraceNumber: string
                creditTraceNumber: string
                reversalId: string
                reversedAt: string
                reversedReason: DuplicateEntry
                reversedDescription: string
                programId: string
                cancelledAt: string
                cancelledReasons:
                - string
                returnId: string
                returnedAt: string
                returnCode: string
                batchDescription: string
        '400':
          description: BadRequest
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ValidationProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: One or more validation errors occurred.
                status: 400
                traceId: string
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.2
                title: Unauthorized
                status: 401
                traceId: string
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
