        example: b6541a7e-4073-4870-bc13-05912c5416f4
      requestBody:
        description: The outgoing ACH transaction to send
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cubi.Ach.WebApi.Dto.InitiateAchCreditDto'
            example:
              creditName: string
              creditAccountNumber: string
              creditRoutingNumber: string
              creditAccountType: Checking
              debitAccountNumber: string
              amount: 0
              processDate: string
              programId: string
              description: string
