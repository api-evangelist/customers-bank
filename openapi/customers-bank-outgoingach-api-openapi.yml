  /outgoing/{id}/reverse:
    post:
      tags:
      - OutgoingAch
      summary: /outgoing/{id}/reverse - POST
      description: 'Attempts to reverse a previously sent ACH transaction (either debit or credit).

        May only be used on transactions in a completed status'
      operationId: post-outgoing-id-reverse
      parameters:
      - name: id
        in: path
        description: The ID of the ACH transaction for which to attempt reversal
        required: true
        schema:
          type: string
          format: uuid
      - name: x-idempotency-key
        in: header
        description: Unique request idenitfier for idempotency.
        required: true
        schema:
          type: string
          format: uuid
        example: b49e24e1-1ccd-4b8a-8f25-6c04feb491b0
      requestBody:
        description: Reversal reason and details
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cubi.Ach.WebApi.Dto.RequestAchReversalDto'
            example:
              reason: string
              description: string
          text/json:
            schema:
              $ref: '#/components/schemas/Cubi.Ach.WebApi.Dto.RequestAchReversalDto'
            example:
              reason: string
              description: string
          application/*+json:
            schema:
              $ref: '#/components/schemas/Cubi.Ach.WebApi.Dto.RequestAchReversalDto'
            example:
