                $ref: '#/components/schemas/Cubi.Common.Abstractions.Paginated_Cubi.Ach.WebApi.Dto.AchTransactionDto'
              example:
                pageSize: 0
                pageOffset: 0
                totalPages: 0
                totalItemCount: 0
                items:
                - id: string
                  referenceDescription: string
                  status: Initiated
                  creditName: string
                  creditAccountNumber: string
                  creditRoutingNumber: string
                  debitAccountNumber: string
                  debitRoutingNumber: string
                  debitAccountType: Checking
                  debitName: string
                  amount: 0
                  creditAccountType: Checking
                  createdAt: string
                  completedAt: string
                  processDate: string
                  direction: Credit
                  lineItemReferenceId: string
                  debitTraceNumber: string
                  creditTraceNumber: string
                  reversalId: string
                  reversedAt: string
                  reversedReason: DuplicateEntry
                  reversedDescription: string
                  programId: string
                  cancelledAt: string
                  cancelledReasons:
                  - string
                  returnId: string
                  returnedAt: string
                  returnCode: string
                  batchDescription: string
        '400':
          description: BadRequest
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ValidationProblemDetails'
              example:
