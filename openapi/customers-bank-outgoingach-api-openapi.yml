  /outgoing:
    get:
      tags:
      - OutgoingAch
      summary: /outgoing - GET
      description: Searches all sent ACH transactions
      operationId: get-outgoing
      parameters:
      - name: FromDate
        in: query
        description: The date from which to search for originated payments
        schema:
          type: string
          format: date-time
      - name: ToDate
        in: query
        description: The date to search until for originated payments
        schema:
          type: string
          format: date-time
      - name: AccountId
        in: query
        description: The ID of the account for which the payments were originated
        schema:
          type: string
          format: uuid
      - name: paginateResults
        in: query
        schema:
          type: boolean
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: perPage
        in: query
        schema:
          type: integer
          format: int32
      - name: sortOn
        in: query
        schema:
          type: string
      - name: sortAscending
        in: query
        schema:
          type: boolean
