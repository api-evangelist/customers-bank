          - 'null'
          description: The Platform Reference Number that was provided when the funding instruction was submitted
        fundingInstructionId:
          type: string
          description: The Funding Instruction Id that will be used in webhooks indicating changes in state to the funding instruction
          format: uuid
      additionalProperties: false
