          type: string
          description: The id of the funding submission that this funding instruction was a part of
          format: uuid
        loanId:
          type: string
          description: The id of the loan that this funding is associated wtih
          format: uuid
        applicationId:
          type: string
          description: The id of the application that this funding's loan was created from
          format: uuid
        accountNumber:
          type:
          - string
          - 'null'
          description: The account number that funds are disbursing to
        accountName:
          type:
          - string
          - 'null'
          description: The name on the account that funds are disbursing to
        accountType:
          $ref: '#/components/schemas/Cubi.ConsumerLending.WebApi.Dto.AccountType'
        routingNumber:
          type:
          - string
          - 'null'
          description: the routing number for the account that funds are disbursing to
        amountToFund:
          type: number
          description: The amount of money to be disbursed in this funding instruction
          format: double
        fundingType:
          $ref: '#/components/schemas/Cubi.ConsumerLending.WebApi.Dto.FundingType'
        fundingState:
          $ref: '#/components/schemas/Cubi.ConsumerLending.WebApi.Dto.FundingState'
        receivedDate:
          type: string
          description: The date that the funding instruction was received. This will UTC
          format: date-time
        sentToRailDate:
          type:
          - string
          - 'null'
          description: The date that the funding instruction was sent to a payment rail. If the funding instruction failed or was rejected before being sent to the payment rail this value will be null. When not null, this value will be UTC
          format: date-time
        platformReferenceNumber:
          type:
          - string
          - 'null'
          description: The platform reference number that was included on the submitted funding instruction
        rejectionReason:
          type:
          - string
          - 'null'
          description: If the funding instruction was rejected, or if the funding failed, this will contain the reason. Otherwise this will be null.
      additionalProperties: false
    Cubi.ConsumerLending.WebApi.Dto.LoanCancellationDetailsDto:
