          type: object
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: {}
    Cubi.ConsumerLending.WebApi.Dto.LoanResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Loan Id
          format: uuid
        applicationId:
          type: string
          description: Application Id of the application that the loan was created from
          format: uuid
        programId:
          type: string
          description: Program Id of the program that the loan is associated with
          format: uuid
        approvedAmount:
          type: number
          description: The amount that the loan was approved for
          format: double
        amountFunded:
          type: number
          description: The amount that has been funded on this loan. This will include all funding instructions that have been successfully processed by payment rails and all funding instructions that have been sent to the payment rail but have not been returned, cancelled or successfully processed
          format: double
        originationFeeAmount:
          type:
          - number
          - 'null'
          description: The origination fee amount for the loan. The total fundable amount on the loan will be the ApprovedAmount less the OriginationFeeAmount
          format: double
        promotionExpiryDate:
          type:
          - string
          - 'null'
          description: The calculated expiry date for the loan. If no Promotion Months value was provided with the application this will be null. If a Promotion Months value was provided this date is calculated by adding Promotion Months to the date the first funding instruction to be set to either the Funded or SentToRail state was sent to the payment rail. If no funding has been set to the Funded or SentToRail state then this value will be null.
          format: date-time
        merchantDiscountRateAmount:
          type:
          - number
          - 'null'
          description: Merchant discount rate (MRD) amount (in dollars) provided on the application. This amount is subtracted from the ApprovedLoanAmount to determine the maximum amount of funds that can be disbursed on an application. If there was no MDR this will return 0.00
          format: double
        disbursementDate:
          type:
          - string
          - 'null'
          description: The calculated disbursement date for the loan. This will be a non-null value if at least one funding instruction has been sent to a payment rail for the loan. The value of this property will be the datetime that the funding instruction was sent to the payment rail in UTC. This value will only be set for the first funding instruction that was sent to the payment rail for the loan. Any subsequent funding instructions sent to a payment rail will _NOT_ modify this value.
          format: date-time
        maturityDate:
          type:
          - string
          - 'null'
          description: The calculated maturity date for the loan. This will be a non-null value if at least one funding instruction has been sent to a payment rail for the loan. The value of this property will be the datetime that the funding instruction was sent to the payment rail in UTC. This value will only be set for the first funding instruction that was sent to the payment rail for the loan. Any subsequent funding instructions sent to a payment rail will _NOT_ modify this value.
          format: date-time
        status:
          $ref: '#/components/schemas/Cubi.ConsumerLending.WebApi.Dto.LoanStatus'
      additionalProperties: false
