openapi: 3.2.0
info:
  title: InstantPayments Outgoing Payments API
  version: v1
servers:
- url: https://cubi-sandbox-api.customersbank.com/InstantPayments/v1
tags:
- name: OutgoingPayments
paths:
  /outgoing:
    post:
      tags:
      - OutgoingPayments
      summary: /outgoing - POST
      description: "Initiates a new instant payment that will be delivered on either the FedNow or RTP rails.   The rail will be determined \nbased on the receiver bank's rail eligibilty among other factors."
      operationId: post-outgoing
      parameters:
      - name: x-idempotency-key
        in: header
        description: Unique request idenitfier for idempotency.
        required: true
        schema:
          type: string
          format: uuid
        example: 05c6f225-d90e-4449-a280-b3ae9924fdec
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cubi.InstantPayments.WebApi.Dto.Outgoing.Initiate.InitiatePaymentDto'
            example:
              amount: 0
              processDate: '2025-04-02T05:00:00+00:00'
              senderAccountNumber: string
              receiverRoutingNumber: string
              receiverAccountNumber: string
              receiverName: string
              receiverAddress1: string
              receiverAddress2: string
              receiverCity: string
              receiverState: string
              receiverZip: string
              receiverCountry: US
              description: string
          text/json:
            schema:
              $ref: '#/components/schemas/Cubi.InstantPayments.WebApi.Dto.Outgoing.Initiate.InitiatePaymentDto'
            example:
              amount: 0
              processDate: '2025-04-02T05:00:00+00:00'
              senderAccountNumber: string
              receiverRoutingNumber: string
              receiverAccountNumber: string
              receiverName: string
              receiverAddress1: string
              receiverAddress2: string
              receiverCity: string
              receiverState: string
              receiverZip: string
              receiverCountry: US
              description: string
          application/*+json:
            schema:
              $ref: '#/components/schemas/Cubi.InstantPayments.WebApi.Dto.Outgoing.Initiate.InitiatePaymentDto'
            example:
              amount: 0
              processDate: '2025-04-02T05:00:00+00:00'
              senderAccountNumber: string
              receiverRoutingNumber: string
              receiverAccountNumber: string
              receiverName: string
              receiverAddress1: string
              receiverAddress2: string
              receiverCity: string
              receiverState: string
              receiverZip: string
              receiverCountry: US
              description: string
      responses:
        '202':
          description: Accepted
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/Cubi.InstantPayments.WebApi.Dto.Outgoing.Initiate.PaymentInitiatedDto'
              examples:
                default:
                  value: null
            application/json:
              schema:
                $ref: '#/components/schemas/Cubi.InstantPayments.WebApi.Dto.Outgoing.Initiate.PaymentInitiatedDto'
              example:
                id: string
                rail: FedNow
            text/json:
              schema:
                $ref: '#/components/schemas/Cubi.InstantPayments.WebApi.Dto.Outgoing.Initiate.PaymentInitiatedDto'
              example:
                id: string
                rail: FedNow
        '400':
          description: BadRequest
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ValidationProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: One or more validation errors occurred.
                status: 400
                traceId: string
        '401':
          description: Unauthorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.2
                title: Unauthorized
                status: 401
                traceId: string
        '403':
          description: Forbidden
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.4
                title: Forbidden
                status: 403
                traceId: string
        '404':
          description: NotFound
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.5
                title: Not Found
                status: 404
                traceId: string
        '500':
          description: InternalServerError
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.6.1
                title: An error occurred while processing your request.
                status: 500
                traceId: string
    get:
      tags:
      - OutgoingPayments
      summary: /outgoing - GET
      description: Searches for outgoing Instant Payments
      operationId: get-outgoing
      parameters:
      - name: fromDate
        in: query
        description: The start date from which to search
        schema:
          type: string
          format: date-time
      - name: toDate
        in: query
        description: The end date for which to search
        schema:
          type: string
          format: date-time
