    Cubi.InstantPayments.WebApi.Dto.Outgoing.Initiate.InitiateRtpDto:
      required:
      - amount
      - receiverAccountNumber
      - receiverAddress1
      - receiverCity
      - receiverCountry
      - receiverName
      - receiverRoutingNumber
      - receiverState
      - receiverZip
      - senderAccountNumber
      type: object
      properties:
        amount:
          minimum: 0.01
          type: number
          description: Amount of Payment, in dollars and cents
          format: double
        processDate:
          type:
          - string
          - 'null'
          description: 'Optional date and time on which to process the payment, if not specified, it will be sent immediately.  If specified, it must be today''s date or a future date.

            If specified, then submission as a full datetime plus timezone offset is HIGHLY recommended over submission as a simple date string, as omission of time will default to midnight and omission of timezone offset will default to UTC.

            Format: yyyy-MM-ddTHH:mm:ss.ffZ'
          format: date-time
          example: '2025-04-02T05:00:00+00:00'
        senderAccountNumber:
          maxLength: 35
          minLength: 1
          type: string
          description: The account number from which to send the payment
        receiverRoutingNumber:
          minLength: 1
          pattern: ^\d{9}$
          type: string
          description: Routing number of the receiving bank.  This must be a federal ABA number, must be exactly 9 digits.
        receiverAccountNumber:
          maxLength: 35
          minLength: 1
          pattern: ^[A-Za-z0-9 .()/'+=:?_#@%,&-]+$
          type: string
          description: The account number of the receiver.
        receiverName:
          maxLength: 35
          minLength: 1
          pattern: ^[A-Za-z0-9 .()/'+=:?_#@%,&-]+$
          type: string
          description: The name of the receiving party
        receiverAddress1:
          maxLength: 35
          minLength: 1
          pattern: ^[A-Za-z0-9 .()/'+=:?_#@%,&-]+$
          type: string
          description: The primary address line of the receiving party
        receiverAddress2:
          maxLength: 35
          minLength: 0
          pattern: ^[A-Za-z0-9 .()/'+=:?_#@%,&-]+$
          type:
          - string
          - 'null'
          description: The secondary address line of the receiving party (optional). Maximum length is 35 characters.
        receiverCity:
          maxLength: 35
          minLength: 1
          pattern: ^[A-Za-z0-9 .()/'+=:?_#@%,&-]+$
          type: string
          description: The city of the receiving party
        receiverState:
          maxLength: 35
          minLength: 1
          pattern: ^[A-Za-z0-9 .()/'+=:?_#@%,&-]+$
          type: string
          description: The state or region of the receiving party
        receiverZip:
          maxLength: 35
          minLength: 1
          pattern: ^[A-Za-z0-9 .()/'+=:?_#@%,&-]+$
          type: string
          description: The postal/zip code of the receiving party
        receiverCountry:
          maxLength: 2
          minLength: 2
          pattern: ^[A-Za-z]+$
          type: string
          description: The country code of the receiving party (ISO 3166-1 alpha-2 format)
          example: US
        description:
          maxLength: 140
          minLength: 0
          pattern: ^[A-Za-z0-9 .()/'+=:?_#@%,&-]+$
          type:
          - string
          - 'null'
          description: Description to be passed in the payment. Maximum length is 140 characters.
      additionalProperties: false
