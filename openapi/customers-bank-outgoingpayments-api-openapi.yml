            application/json:
              schema:
                $ref: '#/components/schemas/Cubi.Common.Abstractions.Paginated_Cubi.InstantPayments.WebApi.Dto.Outgoing.OutgoingPaymentDto'
              example:
                pageSize: 0
                pageOffset: 0
                totalPages: 0
                totalItemCount: 0
                items:
                - id: string
                  amount: 0
                  processDate: string
                  senderAccountNumber: string
                  paymentDate: string
                  deliveryDate: string
                  receiverRoutingNumber: string
                  receiverAccountNumber: string
                  receiverName: string
                  receiverAddress1: string
                  receiverAddress2: string
                  receiverCity: string
                  receiverState: string
                  receiverZip: string
                  receiverCountry: string
                  receiverBankName: string
                  receiverBankAddress1: string
                  receiverBankAddress2: string
                  receiverBankCity: string
                  receiverBankState: string
                  receiverBankZip: string
                  description: string
                  status: Initiated
                  submittedAt: string
                  cancelledAt: string
                  cancelledReason: string
                  completedAt: string
                  confirmationNumber: string
                  rail: FedNow
            text/json:
              schema:
                $ref: '#/components/schemas/Cubi.Common.Abstractions.Paginated_Cubi.InstantPayments.WebApi.Dto.Outgoing.OutgoingPaymentDto'
              example:
                pageSize: 0
                pageOffset: 0
                totalPages: 0
                totalItemCount: 0
                items:
                - id: string
                  amount: 0
                  processDate: string
                  senderAccountNumber: string
                  paymentDate: string
                  deliveryDate: string
                  receiverRoutingNumber: string
                  receiverAccountNumber: string
                  receiverName: string
                  receiverAddress1: string
                  receiverAddress2: string
                  receiverCity: string
                  receiverState: string
                  receiverZip: string
                  receiverCountry: string
                  receiverBankName: string
                  receiverBankAddress1: string
                  receiverBankAddress2: string
                  receiverBankCity: string
                  receiverBankState: string
                  receiverBankZip: string
                  description: string
                  status: Initiated
                  submittedAt: string
                  cancelledAt: string
                  cancelledReason: string
                  completedAt: string
                  confirmationNumber: string
                  rail: FedNow
        '400':
          description: BadRequest
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Microsoft.AspNetCore.Mvc.ValidationProblemDetails'
              example:
                type: https://tools.ietf.org/html/rfc9110#section-15.5.1
                title: One or more validation errors occurred.
                status: 400
