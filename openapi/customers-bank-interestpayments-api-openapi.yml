                totalPages: 0
                totalItemCount: 0
                items:
                - description: string
                  transactionCode: string
                  transactionCodeDescription: string
                  effectiveDate: string
                  postingDate: string
                  amount: 0
                  serialNumber: string
                  controlNumber: string
                  confirmationNumber: string
                  transactionType: string
