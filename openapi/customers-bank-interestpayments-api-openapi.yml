                  coreTransactionId: string
                  processedAt: string
                  checkNumber: string
            text/json:
              schema:
                $ref: '#/components/schemas/Cubi.Common.Abstractions.Paginated_Cubi.Accounts.WebApi.Dto.TransactionDto'
              example:
