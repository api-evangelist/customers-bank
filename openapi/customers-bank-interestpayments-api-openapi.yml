components:
  schemas:
    Microsoft.AspNetCore.Mvc.ProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        traceId:
          type:
          - string
          - 'null'
      additionalProperties: {}
    Cubi.Accounts.Contracts.Commands.TransactionCore.TransactionRail:
      enum:
      - BookTransfer
      - Wire
      - Ach
      - Rtp
      - FedNow
      - InterestPayment
      type: string
    Microsoft.AspNetCore.Mvc.ValidationProblemDetails:
      type: object
      properties:
        type:
          type:
          - string
          - 'null'
        title:
          type:
          - string
          - 'null'
        status:
          type:
          - integer
          - 'null'
          format: int32
        detail:
          type:
          - string
          - 'null'
        traceId:
          type:
          - string
          - 'null'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      additionalProperties: {}
    Cubi.Common.WebApi.Mediatr.Validation.IdentifierContainer_System.Guid:
      type: object
      properties:
        id:
          type: string
          format: uuid
      additionalProperties: false
    Cubi.Accounts.WebApi.Dto.TransactionDto:
      required:
      - description
      - transactionCode
      - transactionType
      type: object
      properties:
        description:
          type: string
          description: The description of the transaction
        transactionCode:
          type: string
          description: The transaction code of the transaction
        transactionCodeDescription:
          type:
          - string
          - 'null'
          description: The description of transaction code
        effectiveDate:
          type:
          - string
          - 'null'
          description: The effective date of the transaction
          format: date-time
        postingDate:
          type:
          - string
          - 'null'
          description: The date the transaction was posted
          format: date-time
        amount:
          type: number
          description: The amount of the transaction
          format: double
        serialNumber:
          type:
          - string
          - 'null'
          description: 'This property is deprecated. Use ConfirmationNumber instead.

            The serial number of the payment.  Typically, this is the check number, if available'
          deprecated: true
        controlNumber:
          type:
          - string
          - 'null'
        confirmationNumber:
          type:
          - string
          - 'null'
        transactionType:
          type: string
          description: 'The type of transaction.

            D = Debit

            C = Credit

            F = Float

            M = Miscellaneous Service Charge

            X = Reversed'
        rail:
          $ref: '#/components/schemas/Cubi.Accounts.Contracts.Commands.TransactionCore.TransactionRail'
        id:
          type:
          - string
          - 'null'
          description: The CUBIX ID of the payment associated with this transaction.  This will be null if the payment was not originated or received within the CUBIX platform
          format: uuid
        coreTransactionId:
          type:
          - string
          - 'null'
          description: The transaction id within the banking core.  This value will be null for intraday transactions
        processedAt:
          type:
          - string
          - 'null'
          description: The date the transaction was processed
          format: date-time
        checkNumber:
          type:
          - string
          - 'null'
          description: Check number which is Serial Number
      additionalProperties: false
    Cubi.Accounts.WebApi.Dto.InterestPaymentDto:
      type: object
      properties:
        amount:
          type: number
          format: double
        description:
          type:
          - string
          - 'null'
      additionalProperties: false
    Cubi.Common.Abstractions.Paginated_Cubi.Accounts.WebApi.Dto.TransactionDto:
      type: object
      properties:
        pageSize:
          type: integer
          format: int32
        pageOffset:
          type: integer
          format: int32
        totalPages:
          type: integer
          format: int32
        totalItemCount:
          type: integer
          format: int32
        items:
          type: array
          items:
            $ref: '#/components/schemas/Cubi.Accounts.WebApi.Dto.TransactionDto'
      additionalProperties: false
x-readme:
  explorer-enabled: false
  proxy-enabled: true
