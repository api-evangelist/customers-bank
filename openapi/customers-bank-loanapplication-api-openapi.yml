components:
  schemas:
    Cubi.ConsumerLending.WebApi.Dto.LoanApplicationCosignerDto:
      required:
      - annualIncome
      - city
      - dateOfBirth
      - debt
      - debtToIncomeRatio
      - ficoScore
      - fullName
      - ssn
      - state
      - streetAddress
      - zipCode
      type: object
      properties:
        ssn:
          minLength: 1
          type: string
          description: Cosigner's SSN. This must be between 9 and 11 characters in length and in a valid SSN format
        fullName:
          minLength: 1
          type: string
          description: Full name of the cosigner. Must be 255 characters long or less
        dateOfBirth:
          type: string
          description: Cosigner's date of birth. All cosigners must be between 18 and 120 years old on the loan application date
          format: date-time
        annualIncome:
          type: number
          description: Annual income of the cosigner.
          format: double
        employerName:
          type:
          - string
          - 'null'
          description: Cosigner's employer name
        emailAddress:
          type:
          - string
          - 'null'
          description: Cosigner's email address
        schoolName:
          type:
          - string
          - 'null'
          description: Name of the post secondary school the cosigner attended
        schoolOpeCode:
          type:
          - string
          - 'null'
          description: The Office of Post Secondary Education (OPE) code for the post secondary school the cosigner attended
        schoolGraduationYear:
          type:
          - integer
          - 'null'
          description: Year that the cosigner graduated from their post secondary school
          format: int32
        degreeType:
          type:
          - string
          - 'null'
          description: Type of degree the cosigner received when graduating from post secondary school
        areaOfStudy:
          type:
          - string
          - 'null'
          description: Area of study for the degree the cosigner received
        deceased:
          type: boolean
          description: Indicates that the cosigner is deceased
        housingStatus:
          $ref: '#/components/schemas/Cubi.ConsumerLending.WebApi.Dto.HousingStatus'
        streetAddress:
          minLength: 1
          type: string
          description: Street portion of the cosigner's primary residence address. Must be 255 characters long or less
        city:
          minLength: 1
          type: string
          description: City portion of the cosigner's primary residence address. Must be 255 characters long or less
        state:
          minLength: 1
          type: string
          description: State portion of the cosigner's primary residence address. Must be 2 characters long
        zipCode:
          minLength: 1
          type: string
          description: Zip Code portion of the cosigner's primary residence address
        homePhoneNumber:
          type:
          - string
          - 'null'
          description: Cosigner's home phone number
        workPhoneNumber:
          type:
          - string
          - 'null'
          description: Cosigner's work phone number
        cellPhoneNumber:
          type:
          - string
          - 'null'
          description: Cosigner's cell phone number
        ficoScore:
          type: integer
          description: Cosigner's FICO score. Must be between 0 and 1000
          format: int32
        debtToIncomeRatio:
          type: number
          description: Cosigner's Debt to Income ratio. Must be between 0.00 and 100.00
          format: double
        debt:
          type: number
          description: Cosigner's amount of Debt. Must be greater than 0.00
          format: double
        creditInquiryCount:
          type: integer
          description: Number of credit inquiries for this person. This count can be over any time period (i.e. over the last 6 months). If this value is being used as part of a policy/program approval rule, then the inclusion of this data and the time period it represents needs to be consistent across all loan applications within that policy/programs.
          format: int32
        sixtyDayLatePaymentCount:
          type: integer
          description: Number of payments later than 60 days for this person. This count can be over any time period (i.e. over the last 6 months). If this value is being used as part of a policy/program approval rule, then the inclusion of this data and the time period it represents needs to be consistent across all loan applications within that policy/program.
          format: int32
        tradeDelinquencyCount:
          type: integer
          description: Number of Currently DQ Trades (any).  his count can be over any time period (i.e. over the last 24 months) If this value is being used as part of a policy/program approval rule, then the inclusion of this data and the time period it represents needs to be consistent across all loan applications within that policy/program.
          format: int32
        chargeOffCount:
          type: integer
          description: Number of Chargeoff in months (excluding collections).  his count can be over any time period (i.e. over the last 24 months) If this value is being used as part of a policy/program approval rule, then the inclusion of this data and the time period it represents needs to be consistent across all loan applications within that policy/program.
          format: int32
        nonTraditionalInquiryCount:
          type: integer
          description: Number of months since any thirty day late payments have been recorded. If this value is being used as part of a policy/program approval rule, then the inclusion of this data and the time period it represents needs to be consistent across all loan applications within that policy/program.
          format: int32
        mortgageDelinquencyCount:
          type: integer
          description: Number of mortgage delinquencies for this person. This count can be over any time period (i.e. over the last 6 months). If this value is being used as part of a policy/program approval rule, then the inclusion of this data and the time period it represents needs to be consistent across all loan applications within that policy/program.
          format: int32
        thirtyDayLatePaymentCount:
          type: integer
          description: Number of payments later than 30 days for this person. This count can be over any time period (i.e. over the last 6 months). If this value is being used as part of a policy/program approval rule, then the inclusion of this data and the time period it represents needs to be consistent across all loan applications within that policy/program.
          format: int32
        numberOfMonthsSinceAnyThirtyDayLatePayments:
          type: integer
          description: Number of months since any thirty day late payments have been recorded. If this value is being used as part of a policy/program approval rule, then the inclusion of this data and the time period it represents needs to be consistent across all loan applications within that policy/program.
          format: int32
        derogatoryRemarkCount:
          type: integer
          description: Number of derogatory remarks for this person. This count can be over any time period (i.e. over the last 6 months). If this value is being used as part of a policy/program approval rule, then the inclusion of this data and the time period it represents needs to be consistent across all loan applications within that policy/program.
          format: int32
        hasFiledForBankruptcy:
          type: boolean
          description: Has this person had a bankruptcy. This value can be over any time period (i.e. over the last 6 months). If this value is being used as part of a policy/program approval rule, then the inclusion of this data and the time period it represents needs to be consistent across all loan applications within that policy/program.
        monthsSinceBankruptcyFiled:
          type: integer
          description: Number of months since this person last filed for bankruptcy.
          format: int32
        monthsSinceBankruptcyDismissed:
          type: integer
          description: Number of months since this person last had a bankruptcy dismissed.
          format: int32
        monthsSinceBankruptcyStatusDate:
          type: integer
          description: Number of months since the last bankruptcy status date.
          format: int32
      additionalProperties: false
    Cubi.ConsumerLending.WebApi.Dto.CreateLoanApplicationDto:
      required:
      - applicationDate
      - apr
      - borrowers
      - isMlaLoan
      - loanAccountNumber
      - loanAmount
      - loanPurpose
      - maximumApprovedLoanAmount
      - mlaChecked
      - ofacChecked
      - partnerStatus
      - platformReferenceNumber
      - programId
      - requestedLoanAmount
      - termLength
      type: object
      properties:
        platformReferenceNumber:
          minLength: 1
          type: string
          description: Provided by the API caller. The value must be unique within the Program that the application is submitted. The value should be between 1 and 36 characters in length
        applicationDate:
          type: string
          description: The date the loan application was completed. It may differ from the submission date if the application was submitted later
          format: date-time
        requestedLoanAmount:
          type: number
          description: The dollar amount the customer requested at the time of initial application.
          format: double
        maximumApprovedLoanAmount:
          type: number
          description: The highest dollar amount this application qualifies for
          format: double
        loanAmount:
          type: number
          description: The dollar amount that will appear on the loan agreement
          format: double
        netFundingAmount:
          type:
          - number
          - 'null'
          description: The amount expected to be disbursed to the borrower after deductions
          format: double
        partnerLoanApprovalDate:
          type:
          - string
          - 'null'
          description: The UTC date-time when the partner approved the application in their system/process
          format: date-time
        apr:
          type: number
          description: The APR in a decimal format. Must be greater than 0. An 18.5% APR should be submitted as 18.5
          format: double
        noteRate:
          type: number
          description: The rate that exists on the note. An 18.5% rate should be submitted as 18.5
          format: double
        collateralCategory:
          type:
          - string
          - 'null'
          description: The description of the category for any collateral tied to the application
        loanPurpose:
          minLength: 1
          type: string
          description: A description of the purpose of the loan
        defaultProbability:
          type: number
          description: The probability (in percentage), as determined by the API caller, that the loan will default to. 18.5% should be submitted as 18.5
          format: double
        customRiskScore:
          type:
          - string
          - 'null'
          description: A risk score that the API caller has established for the application/borrower(s). This is a text field and can be in any form the API caller desires
        customGrade:
          type:
          - string
          - 'null'
          description: A grade that the API caller has assigned to this loan application. This is a text field and can be in any form the API caller desires
        isMlaLoan:
          type: boolean
          description: Indicates if the loan application is governed by the Military Lending Act (MLA)
        mlaChecked:
          type: boolean
          description: Indicates that the application has be verified against the Military Lending Act (MLA)
        ofacChecked:
          type: boolean
          description: Indicates that the borrowers and cosigners have been OFAC checked by the API caller
        promotionDetails:
          $ref: '#/components/schemas/Cubi.ConsumerLending.WebApi.Dto.CreateLoanApplicationPromotionDto'
        borrowers:
          type: array
          items:
            $ref: '#/components/schemas/Cubi.ConsumerLending.WebApi.Dto.LoanApplicationBorrowerDto'
          description: The list of all the borrowers
        cosigners:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Cubi.ConsumerLending.WebApi.Dto.LoanApplicationCosignerDto'
          description: The list of all the cosigners
        programId:
          type: string
          description: The id of the program that this application is being submitted under. A list of programs available for the Partner is available by calling the GET /program API
          format: uuid
        loanAccountNumber:
          minLength: 1
          type: string
          description: Assigned to this application by the caller. This value must be unique within the Program that the application is submitted under. The value needs to be more than 0 characters and up to 20 characters included
        fundImmediatelyOnApproval:
          type: boolean
          description: Indicates that this application should be immediately funded using the ImmediateFundingInstructions when it is approved and converted from an application to a loan
        immediateFundingInstructions:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Cubi.ConsumerLending.WebApi.Dto.FundingInstructionDto'
          description: The list of funding instructions to be executed if the application is approved. The FundImmediatelyOnApproval flag is set to true
        aanReasons:
          type:
          - array
          - 'null'
          items:
            type: string
          description: The list of Adverse Action Notice (AAN) Reasons collected for this application. Maximum length for each AAN Reason is 255 characters included. Anything longer than that will be trimmed. This field is required if PartnerStatus is set to Declined
        propertyDetails:
          $ref: '#/components/schemas/Cubi.ConsumerLending.WebApi.Dto.CreateLoanApplicationPropertyDto'
        contractors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Cubi.ConsumerLending.WebApi.Dto.LoanApplicationContractorDto'
          description: The list of Contractors associated with this application. This is required if the application program is a Home Improvement Loan
        resultOfCounterOfferProcess:
          type:
          - boolean
          - 'null'
          description: Indicates that the application is a result of a counteroffer process being engaged
        monthlyPayment:
          type: number
          description: The monthly payment for the application. Must be greater than 0
          format: double
        termLength:
          type: integer
          description: The loan term for the application inputed as months. Must be greater than 0
          format: int32
        merchantDiscountRatePercentage:
          type:
          - number
          - 'null'
          description: The merchant discount rate (MDR) percentage for the application. If the value is 6.5%, provide 6.5. If the program assigned to this application is configured with a fee type of Mdr or MdrAndOrigination, this value cannot be null and should be 0.00 if no MDR is present
          format: double
        merchantDiscountRateAmount:
          type:
          - number
          - 'null'
          description: The merchant discount rate (MDR) amount (in dollars) for the application. This amount is subtracted from the ApprovedLoanAmount to determine the maximum amount of funds that can be disbursed on an application. If the program assigned to this application is configured with a fee type of Mdr or MdrAndOrigination, this value cannot be null and should be 0.00 if no MDR is present
          format: double
        originationFeePercentage:
          type:
          - number
          - 'null'
          description: The origination fee percentage for the application. If the value is six point five percent, provide 6.5. If the program assigned to this application is configured with a fee type of Origination or MdrAndOrigination, this value cannot be null and should be 0.00 if no origination fee is present
          format: double
        originationFeeAmount:
          type:
          - number
          - 'null'
          description: The origination fee amount (in dollars) for the application. This amount is subtracted from the ApprovedLoanAmount to determine the maximum amount of funds that can be disbursed on an application. If the program assigned to this application is configured with a fee type of Origination or MdrAndOrigination, this value cannot be null and should be 0.00 if no origination fee is present
          format: double
        paymentFactor:
          type:
          - number
          - 'null'
          description: The factor used to calculate the monthly payment
          format: double
        partnerStatus:
          $ref: '#/components/schemas/Cubi.ConsumerLending.WebApi.Dto.ApplicationPartnerStatus'
        partnerStatusReason:
          type:
          - string
          - 'null'
          description: The reason for the partner setting the indicated PartnerStatus state
        acquisitionChannelName:
          type:
          - string
