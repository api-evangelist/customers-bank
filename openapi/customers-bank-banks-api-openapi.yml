                $ref: '#/components/schemas/Cubi.Common.Abstractions.Paginated_Cubi.ITOperations.WebApi.Dto.BankDto'
              example:
                pageSize: 0
                pageOffset: 0
                totalPages: 0
                totalItemCount: 0
                items:
                - locationId: 0
                  bankName: string
                  routingCode: string
                  alternateRoutingCode: string
                  routingType: string
                  pairedBic: string
                  countryCode: string
                  branchName: string
                  streetAddress: string
                  stateOrProvince: string
                  postalCode: string
                  city: string
            text/json:
