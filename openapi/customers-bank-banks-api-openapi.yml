        description: The routing code to search for.  Can be an ABA, BIC/Swift, or any other international routing code
        schema:
          type: string
          example: '123456789'
        example: 123456789
      - name: routingType
        in: query
        description: The routing code type to search for (eg. BIC, ABA, etc.)
        schema:
          type: string
          example: ABA
        example: ABA
      - name: countryCode
        in: query
        description: The country code to search for
        schema:
          type: string
          example: US
        example: US
      - name: paginateResults
        in: query
        schema:
          type: boolean
      - name: page
        in: query
        schema:
          type: integer
          format: int32
      - name: perPage
        in: query
        schema:
          type: integer
          format: int32
      - name: sortOn
        in: query
        schema:
          type: string
      - name: sortAscending
        in: query
        schema:
          type: boolean
