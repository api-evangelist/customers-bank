                  value: null
            application/json:
              schema:
                $ref: '#/components/schemas/Cubi.Ach.WebApi.Dto.PartnerProgramDto'
              example:
                id: string
                partnerId: string
                achCompanyId: string
                secCode: PPD
                batchHeader: string
                writeUnbalancedFiles: true
                writeBatchPerTransaction: true
            text/json:
