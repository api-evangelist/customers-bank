        description: Unique request idenitfier for idempotency.
        required: true
        schema:
          type: string
          format: uuid
        example: d13e5a3f-2ddb-40b7-88b0-b3b0901aa76e
      requestBody:
        description: Transfer initiation payload
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Cubi.Transfers.WebApi.Dto.BookTransfers.InitiateBookTransferDto'
            example:
              fromAccountId: string
              toAccountId: string
              amount: 0
              internalMemo: string
              publicMemo: string
              coreMemo: string
              purposeCode: string
              purposeDescription: string
              processDate: string
          text/json:
            schema:
              $ref: '#/components/schemas/Cubi.Transfers.WebApi.Dto.BookTransfers.InitiateBookTransferDto'
            example:
              fromAccountId: string
              toAccountId: string
              amount: 0
              internalMemo: string
              publicMemo: string
              coreMemo: string
              purposeCode: string
              purposeDescription: string
              processDate: string
